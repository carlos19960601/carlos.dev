<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Carlos — 个人主页与技术思考</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap"
			rel="stylesheet"
		/>
		<script>
			// 防止暗色模式初次加载闪烁
			try {
				const theme = localStorage.getItem('site_theme');
				const supportDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
				if (theme === 'dark' || (!theme && supportDarkMode)) {
					document.documentElement.classList.add('dark');
				} else {
					document.documentElement.classList.remove('dark');
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body class="bg-background text-foreground antialiased selection:bg-neutral-200 dark:selection:bg-neutral-800 transition-colors duration-200">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
